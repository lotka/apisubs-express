<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Extract Audio</title>
    <link rel="stylesheet" href="../bootstrap-custom.css">
    <script src="/assets/ffmpeg/package/dist/umd/ffmpeg.js"></script>
    <script src="/assets/util/package/dist/umd/index.js"></script>
    <script src="/env.js"></script>
  </head>
  <body class="app-shell">
    <main class="container py-4 py-md-5">
      <nav class="top-nav">
        <a href="../">Subtitle Tools</a>
      </nav>

      <section class="tool-layout">
        <div class="tool-intro">
          <div class="eyebrow">Local conversion</div>
          <h1>Extract audio from video</h1>
          <p class="lead">Create an MP3 from a video file without uploading it to a server.</p>
        </div>

        <div class="tool-panel">
          <form id="apiKeyForm">
            <div class="mb-3">
              <label for="fileUpload" class="form-label">Video file</label> 
              <input id='fileUpload' class="form-control" type="file">
            </div>
          </form>
          <p id="message" class="status-line"></p>
          <button id="downloadBtn" class="btn btn-primary" style="display: none;">Download MP3</button>
          <video id="output-video" class="mt-4" style="display: none;" controls></video>
        </div>
      </section>
    </main>
    <script>
      const { fetchFile } = FFmpegUtil;
      const { FFmpeg } = FFmpegWASM;
      let ffmpeg = null;
      let currentSRTFile = null;
      let lastListener = null;

      function loadTextFile(filePath) {
        return fetch(filePath)
          .then(response => {
            if (!response.ok) {
              throw new Error('Network response was not ok');
            }
            return response.text();
          })
          .catch(error => {
            console.error('Error loading the file:', error);
            throw error;
          });
      }

      const transcode = async ({ target: { files } }) => {
        if(lastListener) {
          document.getElementById('downloadBtn').removeEventListener('click', lastListener);
        }

        const message = document.getElementById('message');
        message.innerHTML = 'Loading ffmpeg..';
        if (ffmpeg === null) {
          ffmpeg = new FFmpeg();
          ffmpeg.on("log", ({ message }) => {
            console.log(message);
          })
          ffmpeg.on("progress", ({ progress, time }) => {
            message.innerHTML = `${progress * 100} %, time: ${time / 1000000} s`;
          });
          await ffmpeg.load({
            // coreURL: "/assets/core/package/dist/umd/ffmpeg-core.js",
            coreURL: "/assets/core-mt/package/dist/umd/ffmpeg-core.js",
          });
        }
        const { name } = files[0];
        message.innerHTML = 'Loading file..';
        await ffmpeg.writeFile(name, await fetchFile(files[0]));
        message.innerHTML = 'Locally converting video to audio...';
        console.time('exec');
        await ffmpeg.exec(['-i', name,  'output.mp3','-ar','16000', '-ac','1', '-map', '0:a']);
        console.timeEnd('exec');
        message.innerHTML = 'Finished creating audio file';
        const data = await ffmpeg.readFile('output.mp3');
        const video = document.getElementById('output-video');
        video.src = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

        document.getElementById("output-video").style.display = "block";
        document.getElementById("downloadBtn").style.display = "block";

        lastListener = () => {            
            // Create a Blob object with the content
            const blob = new Blob([data], { type: 'audio/mp3' });

            // Create a temporary link element
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = name.split('.')[0] + '.mp3'; // Filename for the download

            // Append the link to the document and trigger the download
            document.body.appendChild(link);
            link.click();

            // Clean up and remove the temporary link
            document.body.removeChild(link);
        }

        document.getElementById('downloadBtn').addEventListener('click', lastListener);
      }

      const elm = document.getElementById('fileUpload');
      elm.addEventListener('change', transcode);
    </script>
  </body>
</html>
